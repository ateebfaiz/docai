[project]
name = "ai-cli"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
    "docling>=2.124.0",
    "httpx>=0.28.1",
    "typer>=0.26.8",
    "torch>=2.13.0",
    "torchvision>=0.28.0",
]

[tool.uv]
index-strategy = "unsafe-best-match"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
